<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baldan — Loja e NFC-e</title>
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-primary: #0D2A5C;
      --brand-primary-mid: #2E6BB5;
      --brand-primary-soft: #E8F0FA;
      --brand-accent: #F5B400;
      --brand-accent-soft: #FFF6D6;
      --brand-sky: #5BA8E0;
      --brand-ink: #0D2A5C;
      --brand-muted: #5F6B7A;
      --brand-faint: #9AA3B0;
      --brand-bg: #F4F7FB;
      --brand-surface: #FFFFFF;
      --brand-line: #E3E9F1;
      --ok: #1F7A4D;
      --ok-soft: #E6F5EE;
      --warn: #C98900;
      --warn-soft: #FFF6D6;
      --danger: #B42318;
      --danger-soft: #FDECEA;
      --pay: #0D2A5C;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(13, 42, 92, 0.07);
      --font-ui: "Poppins", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-ui);
      color: var(--brand-ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(245, 180, 0, 0.18), transparent 50%),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(91, 168, 224, 0.2), transparent 45%),
        var(--brand-bg);
      min-height: 100vh;
    }
    button, input, select { font: inherit; }
    .btn {
      appearance: none; border: 0; cursor: pointer; font-weight: 600;
      border-radius: 999px; padding: 11px 18px; transition: transform .12s ease, opacity .12s ease;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:disabled { opacity: .65; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--brand-primary); color: #fff; }
    .btn-accent { background: var(--brand-accent); color: var(--brand-primary); }
    .btn-ghost { background: #fff; border: 1px solid var(--brand-line); color: var(--brand-primary); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-soft { background: var(--brand-primary-soft); color: var(--brand-primary); }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }
    .pill.danger { background: var(--danger-soft); color: var(--danger); }
    .pill.warn { background: var(--warn-soft); color: var(--warn); }
    .toast {
      display: none; padding: 12px 14px; border-radius: 14px;
      background: var(--ok-soft); color: var(--ok); margin-bottom: 14px; font-weight: 600;
      box-shadow: var(--shadow);
    }
    .toast.on { display: block; }
    .toast.err { background: var(--danger-soft); color: var(--danger); }

    /* Login */
    .login {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .login-card {
      width: min(440px, 100%);
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .login-card img { max-width: 220px; margin-bottom: 8px; }
    .login-card h1 { margin: 8px 0 4px; font-size: 1.35rem; }
    .login-card .tagline { color: var(--brand-muted); font-size: .9rem; margin-bottom: 22px; }
    .field { margin-bottom: 12px; text-align: left; }
    .field label { display: block; font-size: .78rem; font-weight: 600; color: var(--brand-muted); margin-bottom: 4px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 12px; border: 1px solid var(--brand-line);
      border-radius: 12px; background: #fff;
    }
    .field input:focus, .field select:focus { outline: 2px solid rgba(46,107,181,.35); border-color: var(--brand-primary-mid); }

    /* App shell */
    .app {
      display: grid;
      grid-template-columns: 232px 1fr;
      min-height: 100vh;
    }
    .side {
      background: var(--brand-primary);
      color: #fff;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .brand-block {
      background: #fff;
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 14px;
      text-align: center;
    }
    .brand-block img { width: 100%; max-width: 170px; }
    .brand-block p { margin: 6px 0 0; color: var(--brand-primary-mid); font-size: .65rem; font-weight: 700; letter-spacing: .08em; }
    .nav {
      appearance: none; border: 0; background: transparent; color: rgba(255,255,255,.88);
      text-align: left; padding: 11px 12px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: .9rem;
    }
    .nav:hover { background: rgba(255,255,255,.08); }
    .nav.on { background: rgba(245,180,0,.22); color: var(--brand-accent); }
    .side-foot { margin-top: auto; padding: 12px 8px 4px; font-size: .78rem; opacity: .8; }
    .main { padding: 22px 24px 40px; min-width: 0; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .page-head h1 { margin: 0; font-size: 1.55rem; letter-spacing: -.02em; }
    .page-head p { margin: 6px 0 0; color: var(--brand-muted); font-size: .92rem; max-width: 52ch; }

    .mobile-bar, .side-close, .side-backdrop { display: none; }
    .mobile-bar {
      position: sticky; top: 0; z-index: 25;
      align-items: center; gap: 10px;
      padding: 10px 12px;
      background: var(--brand-primary);
      color: #fff;
      box-shadow: 0 4px 16px rgba(13,42,92,.2);
    }
    .mobile-bar img { height: 32px; background: #fff; border-radius: 8px; padding: 2px 6px; }
    .mobile-bar .title { flex: 1; font-weight: 700; font-size: .92rem; }
    .menu-btn {
      appearance: none; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1);
      color: #fff; border-radius: 10px; width: 42px; height: 42px; cursor: pointer;
      font-size: 1.25rem; font-weight: 700; line-height: 1;
    }
    .side-close {
      appearance: none; border: 0; background: rgba(255,255,255,.12); color: #fff;
      border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: .85rem;
      align-self: flex-end; margin-bottom: 8px;
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .mobile-bar { display: flex; }
      .side-backdrop {
        display: block; position: fixed; inset: 0; z-index: 30;
        background: rgba(7, 24, 51, .45); opacity: 0; pointer-events: none;
        transition: opacity .2s ease;
      }
      .side-backdrop.on { opacity: 1; pointer-events: auto; }
      .side {
        position: fixed; top: 0; left: 0; bottom: 0; width: min(280px, 86vw); z-index: 35;
        transform: translateX(-105%);
        transition: transform .22s ease;
        box-shadow: 8px 0 28px rgba(0,0,0,.25);
        overflow-y: auto;
      }
      .side.open { transform: translateX(0); }
      .side-close { display: inline-flex; }
      .main { padding: 14px 14px 32px; }
      .page-head h1 { font-size: 1.25rem; }
      .home-hero { padding: 20px; }
      .home-hero h1 { font-size: 1.35rem; }
      .cards { grid-template-columns: 1fr 1fr; }
      .search-bar { flex-wrap: wrap; }
      .search-bar input { min-width: 0; width: 100%; }
      .search-bar .btn { flex: 1; }
      .cart-item { grid-template-columns: 1fr; }
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table.data { min-width: 560px; }
      body.menu-open { overflow: hidden; }
    }
    @media (max-width: 520px) {
      .cards { grid-template-columns: 1fr; }
      .actions-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--brand-surface);
      border: 1px solid var(--brand-line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row.between { justify-content: space-between; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    .home-hero {
      border-radius: 22px;
      padding: 28px;
      background:
        linear-gradient(120deg, rgba(13,42,92,.94), rgba(46,107,181,.88)),
        var(--brand-primary);
      color: #fff;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }
    .home-hero h1 { margin: 0 0 8px; font-size: 1.7rem; }
    .home-hero p { margin: 0; opacity: .9; max-width: 46ch; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .card {
      appearance: none; border: 1px solid var(--brand-line); background: #fff;
      border-radius: 18px; padding: 18px 16px; text-align: left; cursor: pointer;
      box-shadow: var(--shadow); transition: border-color .15s ease, transform .12s ease;
    }
    .card:hover { border-color: var(--brand-primary-mid); transform: translateY(-2px); }
    .card .label { font-weight: 700; color: var(--brand-primary); }
    .card .desc { margin-top: 6px; font-size: .8rem; color: var(--brand-muted); line-height: 1.35; }
    .card .mark {
      width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
      background: var(--brand-primary-soft); color: var(--brand-primary); font-weight: 700; margin-bottom: 12px;
    }

    table.data { width: 100%; border-collapse: collapse; font-size: .88rem; }
    table.data th, table.data td { padding: 10px 10px; border-bottom: 1px solid var(--brand-line); text-align: left; }
    table.data th { color: var(--brand-muted); font-size: .74rem; font-weight: 600; }
    .linkish {
      appearance: none; border: 1px solid var(--brand-line); background: #fff;
      padding: 5px 10px; border-radius: 999px; cursor: pointer; margin-right: 4px; font-size: .8rem; font-weight: 600;
    }

    /* PDV modern */
    .pdv { display: grid; grid-template-columns: 1.4fr .9fr; gap: 16px; align-items: start; }
    @media (max-width: 980px) { .pdv { grid-template-columns: 1fr; } }
    .cart-list { display: flex; flex-direction: column; gap: 8px; min-height: 280px; }
    .cart-item {
      display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
      padding: 12px 14px; border-radius: 14px; background: var(--brand-primary-soft); border: 1px solid transparent;
    }
    .cart-item strong { display: block; font-size: .92rem; }
    .cart-item .meta { font-size: .75rem; color: var(--brand-muted); }
    .qty {
      display: inline-flex; align-items: center; gap: 6px; background: #fff;
      border-radius: 999px; padding: 4px 8px; border: 1px solid var(--brand-line);
    }
    .qty button {
      appearance: none; border: 0; background: var(--brand-primary-soft); width: 26px; height: 26px;
      border-radius: 50%; cursor: pointer; font-weight: 700; color: var(--brand-primary);
    }
    .summary {
      position: sticky; top: 16px;
      background: #fff; border-radius: 20px; border: 1px solid var(--brand-line);
      padding: 18px; box-shadow: var(--shadow);
    }
    .summary .total { font-size: 1.7rem; font-weight: 700; margin: 8px 0 16px; letter-spacing: -.02em; }
    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .actions-grid .btn { width: 100%; border-radius: 12px; padding: 12px 10px; font-size: .85rem; }
    .actions-grid .span2 { grid-column: 1 / -1; }
    .empty {
      border: 1px dashed var(--brand-line); border-radius: 16px; padding: 36px 20px;
      text-align: center; color: var(--brand-muted); background: rgba(255,255,255,.6);
    }
    .search-bar {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .search-bar input {
      flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--brand-line); background: #fff;
    }

    .modal-back {
      display: none; position: fixed; inset: 0; background: rgba(7, 24, 51, .45);
      align-items: center; justify-content: center; z-index: 40; padding: 16px;
    }
    .modal-back.on { display: flex; }
    .modal {
      background: #fff; border-radius: 20px; padding: 22px; width: min(520px, 100%);
      max-height: 90vh; overflow: auto; box-shadow: 0 24px 60px rgba(0,0,0,.2);
    }
    .modal h3 { margin: 0 0 12px; }
    .cupom {
      width: 240px; margin: 8px auto; border: 2px dashed var(--brand-primary-mid);
      padding: 14px; text-align: center; font-size: .78rem; background: #fff; border-radius: 12px;
    }
    .hint { font-size: .8rem; color: var(--brand-muted); }
    .stat {
      background: #fff; border-radius: 16px; border: 1px solid var(--brand-line);
      padding: 16px; box-shadow: var(--shadow);
    }
    .stat .n { font-size: 1.4rem; font-weight: 700; }
    .stat .l { font-size: .78rem; color: var(--brand-muted); margin-top: 4px; }
    .prod-pick {
      width: 100%; text-align: left; appearance: none; border: 1px solid var(--brand-line);
      background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer;
    }
    .prod-pick:hover { border-color: var(--brand-primary-mid); background: var(--brand-primary-soft); }
    .venda-cli {
      display: grid; gap: 10px; margin-bottom: 14px; padding-bottom: 14px;
      border-bottom: 1px solid var(--brand-line);
    }
    .combo { position: relative; }
    .combo-list {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 8;
      max-height: 220px; overflow: auto; background: #fff;
      border: 1px solid var(--brand-line); border-radius: 12px; box-shadow: var(--shadow);
    }
    .combo-item {
      width: 100%; text-align: left; appearance: none; border: 0; background: #fff;
      padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--brand-line);
      font: inherit; color: inherit;
    }
    .combo-item:last-child { border-bottom: 0; }
    .combo-item:hover, .combo-item:focus { background: var(--brand-primary-soft); outline: none; }
    .cli-chip {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border-radius: 12px; background: var(--brand-primary-soft);
      border: 1px solid rgba(46,107,181,.25);
    }
    .cli-chip strong { display: block; font-size: .95rem; }
    .venda-tools {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 14px;
      border-top: 1px solid var(--brand-line); align-items: center;
    }
    .brand-block img, .login-card img, .mobile-bar img { object-fit: contain; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="modal-back" id="modal"></div>

  <script>
    const money = (n) => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    const state = {
      screen: "login",
      role: "equipe",
      user: "Márcia",
      toast: "",
      toastErr: false,
      sub: false,
      caixaAberto: false,
      fundoCaixa: 200,
      cart: [],
      clienteVenda: null,
      emitirNfce: true,
      descontoTipo: "none",
      descontoValor: 0,
      filtroProd: "",
      filtroCli: "",
      cliBusca: "",
      cliDropOpen: false,
      menuOpen: false,
    };

    const LOGO_JPG = "assets/brand/baldan_logo.jpg?v=a8";
    const LOGO_SVG = "assets/brand/logo-principal.svg?v=a8";
    function logoImg(extraClass) {
      return `<img class="${extraClass || ""}" src="${LOGO_JPG}" alt="Baldan" onerror="this.onerror=null;this.src='${LOGO_SVG}'" />`;
    }

    const marcas = [
      { id: "m1", nome: "VENOSAN" },
      { id: "m2", nome: "SIGVARIS" },
      { id: "m3", nome: "Baldan loja" },
    ];
    const categorias = [
      { id: "c1", nome: "Ortopédicos" },
      { id: "c2", nome: "Funeral / urna" },
      { id: "c3", nome: "Geral" },
    ];
    let produtos = [
      { id: "p1", barra: "7898360918430", nome: "Meia ortopédica 4000 30-40 AGH / G", marca: "VENOSAN", cat: "Ortopédicos", custo: 280, preco: 465, estoque: 2, ref: "00BG20003", ncm: "6115.10.11" },
      { id: "p2", barra: "7898360918447", nome: "Meia ortopédica 4000 30-40 AGH / M", marca: "VENOSAN", cat: "Ortopédicos", custo: 210, preco: 350, estoque: 7, ref: "00BG42002", ncm: "6115.10.11" },
      { id: "p3", barra: "7898360918454", nome: "Meia ortopédica 4000 30-40 AGH / P", marca: "VENOSAN", cat: "Ortopédicos", custo: 190, preco: 329, estoque: 0, ref: "00BG42001", ncm: "6115.10.11" },
      { id: "p4", barra: "7891000100103", nome: "Urna padrão", marca: "Baldan loja", cat: "Funeral / urna", custo: 900, preco: 1800, estoque: 5, ref: "URN-01", ncm: "4421.90.00" },
      { id: "p5", barra: "7891000100202", nome: "Translado municipal", marca: "Baldan loja", cat: "Geral", custo: 400, preco: 680, estoque: 99, ref: "TR-MUN", ncm: "0000.00.00" },
      { id: "p6", barra: "7891000100301", nome: "Colete ortopédico M", marca: "SIGVARIS", cat: "Ortopédicos", custo: 120, preco: 289, estoque: 4, ref: "COL-M", ncm: "9021.10.20" },
    ];
    let clientes = [
      { id: "cl1", nome: "Família Santos", doc: "123.456.789-00", tel: "(16) 99999-1001", email: "santos@email.com", plano: true, dependentes: ["Maria Santos", "Pedro Santos"] },
      { id: "cl2", nome: "Ana Oliveira", doc: "987.654.321-00", tel: "(16) 98888-2002", email: "", plano: false, dependentes: [] },
      { id: "cl3", nome: "Consumidor final", doc: "", tel: "", email: "", plano: false, dependentes: [] },
    ];
    let notes = [];
    let vendasDia = [];
    let consignados = [
      { id: "cg1", quando: "25/08/2026 08:40", clienteId: "cl1", cliente: "Família Santos", produtoId: "p6", produto: "Colete ortopédico M", qtd: 1, status: "aberto" },
    ];
    let saleSeq = 1042;
    let consSeq = 2;
    let sangriasDia = [];

    function toast(msg, err) {
      state.toast = msg;
      state.toastErr = !!err;
      render();
    }
    function cartSubtotal() {
      return state.cart.reduce((s, i) => s + i.qtd * i.preco, 0);
    }
    function cartDesconto() {
      const sub = cartSubtotal();
      if (state.descontoTipo === "pct") return Math.min(sub, sub * (Number(state.descontoValor) || 0) / 100);
      if (state.descontoTipo === "rs") return Math.min(sub, Number(state.descontoValor) || 0);
      return 0;
    }
    function cartTotal() {
      return Math.max(0, cartSubtotal() - cartDesconto());
    }
    function openModal(html) {
      const m = document.getElementById("modal");
      m.classList.add("on");
      m.innerHTML = `<div class="modal">${html}</div>`;
    }
    function closeModal() {
      const m = document.getElementById("modal");
      m.classList.remove("on");
      m.innerHTML = "";
    }

    function shell(active, body) {
      const items = [
        ["home", "Início"],
        ["caixa", "Caixa"],
        ["pdv", "Venda"],
        ["consignados", "Consignado"],
        ["produtos", "Produtos"],
        ["marcas", "Marcas"],
        ["clientes", "Clientes"],
        ["estoque", "Estoque"],
        ["notas", "Notas"],
      ];
      if (state.role === "contador") items.push(["config", "Configuração"]);
      const labels = Object.fromEntries(items);
      const pageTitle = labels[active] || "Baldan";
      return `
        <div class="app">
          <header class="mobile-bar">
            <button type="button" class="menu-btn" id="menu-open" aria-label="Abrir menu">☰</button>
            ${logoImg()}
            <span class="title">${pageTitle}</span>
          </header>
          <div class="side-backdrop ${state.menuOpen ? "on" : ""}" id="menu-backdrop"></div>
          <aside class="side ${state.menuOpen ? "open" : ""}" id="side-menu">
            <button type="button" class="side-close" id="menu-close">Fechar menu</button>
            <div class="brand-block">
              ${logoImg()}
              <p>SERVIÇOS HUMANIZADOS</p>
            </div>
            ${items.map(([id, label]) => `<button type="button" class="nav ${active === id ? "on" : ""}" data-go="${id}">${label}</button>`).join("")}
            <button type="button" class="nav" data-go="login">Sair</button>
            <div class="side-foot">${state.user}<br /><a href="identidade-visual.html" style="color:#F5B400">Identidade</a></div>
          </aside>
          <main class="main">
            <div class="toast ${state.toast ? "on" : ""} ${state.toastErr ? "err" : ""}">${state.toast}</div>
            ${body}
          </main>
        </div>`;
    }

    function bindNav() {
      document.body.classList.toggle("menu-open", !!state.menuOpen && state.screen !== "login");
      const openBtn = document.getElementById("menu-open");
      const closeBtn = document.getElementById("menu-close");
      const backdrop = document.getElementById("menu-backdrop");
      if (openBtn) openBtn.onclick = () => { state.menuOpen = true; render(); };
      if (closeBtn) closeBtn.onclick = () => { state.menuOpen = false; render(); };
      if (backdrop) backdrop.onclick = () => { state.menuOpen = false; render(); };

      document.querySelectorAll("[data-go]").forEach((b) => {
        b.onclick = () => {
          const go = b.dataset.go;
          state.menuOpen = false;
          if (go === "login") { state.screen = "login"; state.toast = ""; render(); return; }
          if (go === "pdv" && !state.caixaAberto) {
            state.screen = "caixa";
            toast("Abra o caixa antes de vender.", true);
            return;
          }
          state.screen = go;
          state.toast = "";
          render();
        };
      });
    }

    function addToCart(p) {
      if (!p) return;
      if (p.estoque <= 0) { toast("Sem estoque deste produto.", true); return; }
      const found = state.cart.find((i) => i.id === p.id);
      if (found) found.qtd += 1;
      else state.cart.push({ id: p.id, nome: p.nome, barra: p.barra, preco: p.preco, qtd: 1 });
      render();
    }

    function modalBusca(prefill) {
      openModal(`
        <h3>Buscar produto</h3>
        <div class="field"><label>Nome, referência ou código</label><input id="prod-q" value="${prefill || ""}" autofocus /></div>
        <div id="prod-hits" style="max-height:280px;overflow:auto;margin:8px 0"></div>
        <button type="button" class="btn btn-ghost" id="cancel-m">Cancelar</button>`);
      const paint = () => {
        const q = document.getElementById("prod-q").value.trim().toLowerCase();
        const list = produtos.filter((p) => !q || p.nome.toLowerCase().includes(q) || p.ref.toLowerCase().includes(q) || p.barra.includes(q));
        document.getElementById("prod-hits").innerHTML = list.map((p) => `
          <button type="button" class="prod-pick" data-add="${p.id}">
            <strong>${p.nome}</strong><br /><span class="hint">${money(p.preco)} · estoque ${p.estoque}</span>
          </button>`).join("") || `<p class="hint">Nenhum produto encontrado.</p>`;
        document.querySelectorAll("[data-add]").forEach((b) => {
          b.onclick = () => {
            addToCart(produtos.find((x) => x.id === b.dataset.add));
            closeModal();
            toast("Produto adicionado.");
          };
        });
      };
      document.getElementById("prod-q").oninput = paint;
      document.getElementById("cancel-m").onclick = closeModal;
      paint();
    }

    function pickClienteVenda(id) {
      if (!id || id === "__final__") {
        state.clienteVenda = null;
        toast("Consumidor final nesta venda.");
      } else {
        const c = clientes.find((x) => x.id === id);
        if (!c) { toast("Cliente não encontrado.", true); return; }
        state.clienteVenda = c;
        toast("Cliente: " + c.nome);
      }
      state.cliBusca = "";
      state.cliDropOpen = false;
      render();
    }

    function bindClienteCombo() {
      const limparCli = document.getElementById("limpar-cli");
      if (limparCli) {
        limparCli.onclick = () => {
          state.clienteVenda = null;
          state.cliBusca = "";
          state.cliDropOpen = true;
          render();
          requestAnimationFrame(() => {
            const inp = document.getElementById("cli-busca");
            if (inp) inp.focus();
          });
        };
      }

      const cliBusca = document.getElementById("cli-busca");
      if (cliBusca) {
        cliBusca.addEventListener("focus", () => {
          if (state.cliDropOpen) return;
          state.cliDropOpen = true;
          const val = cliBusca.value;
          const caret = cliBusca.selectionStart;
          render();
          requestAnimationFrame(() => {
            const again = document.getElementById("cli-busca");
            if (!again) return;
            again.focus();
            again.value = val;
            try { again.setSelectionRange(caret, caret); } catch (_) {}
          });
        });
        cliBusca.addEventListener("input", () => {
          state.cliBusca = cliBusca.value;
          state.cliDropOpen = true;
          const caret = cliBusca.selectionStart;
          render();
          requestAnimationFrame(() => {
            const again = document.getElementById("cli-busca");
            if (!again) return;
            again.focus();
            try { again.setSelectionRange(caret, caret); } catch (_) {}
          });
        });
        cliBusca.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            state.cliDropOpen = false;
            render();
          }
        });
      }

      const lista = document.getElementById("cli-lista");
      if (lista) {
        lista.addEventListener("mousedown", (e) => {
          const btn = e.target.closest("[data-cli]");
          if (!btn || btn.hasAttribute("data-cli-empty")) return;
          e.preventDefault();
          e.stopPropagation();
          pickClienteVenda(btn.getAttribute("data-cli"));
        });
      }
    }

    function modalPagamento() {
      if (state.cart.length === 0) { toast("Adicione pelo menos um item.", true); return; }
      const sub = cartSubtotal();
      const desc = cartDesconto();
      const total = cartTotal();
      openModal(`
        <h3>Pagamento</h3>
        <p class="hint">Subtotal ${money(sub)}${desc > 0 ? ` · desconto −${money(desc)}` : ""}</p>
        <p>Total <strong>${money(total)}</strong></p>
        <div class="field"><label>Forma</label>
          <select id="forma"><option>Dinheiro</option><option>PIX</option><option>Cartão</option><option>À vista (com desconto)</option></select>
        </div>
        <label style="display:flex;gap:8px;align-items:center;margin:12px 0;font-size:.9rem">
          <input type="checkbox" id="emitir" ${state.emitirNfce ? "checked" : ""} /> Emitir NFC-e nesta venda
        </label>
        <div class="field"><label>Nesta demonstração, o retorno da nota será</label>
          <select id="cenario"><option value="ok">Autorizada</option><option value="err">Recusada</option></select>
        </div>
        <div class="row">
          <button type="button" class="btn btn-primary" id="confirmar">${state.sub ? "Processando…" : "Confirmar pagamento"}</button>
          <button type="button" class="btn btn-ghost" id="cancel-m">Cancelar</button>
        </div>`);
      document.getElementById("cancel-m").onclick = closeModal;
      document.getElementById("confirmar").onclick = () => {
        if (state.sub) return;
        state.sub = true;
        state.emitirNfce = document.getElementById("emitir").checked;
        const cenario = document.getElementById("cenario").value;
        const btn = document.getElementById("confirmar");
        btn.disabled = true;
        btn.textContent = "Processando…";
        const clienteNome = state.clienteVenda ? state.clienteVenda.nome : "Consumidor final";
        const saleId = saleSeq++;
        const descPago = cartDesconto();
        const totalPago = cartTotal();
        setTimeout(() => {
          state.sub = false;
          state.cart.forEach((i) => {
            const p = produtos.find((x) => x.id === i.id);
            if (p) p.estoque = Math.max(0, p.estoque - i.qtd);
          });
          let nf = "sem nota";
          if (state.emitirNfce) {
            const id = "n" + saleId;
            if (cenario === "ok") {
              notes.unshift({ id, sale: saleId, when: "25/08/2026 agora", who: clienteNome, value: totalPago, status: "ok" });
              nf = "autorizada";
            } else {
              notes.unshift({ id, sale: saleId, when: "25/08/2026 agora", who: clienteNome, value: totalPago, status: "err" });
              nf = "recusada";
            }
          }
          vendasDia.unshift({ id: saleId, cliente: clienteNome, total: totalPago, desconto: descPago, nf });
          closeModal();
          if (state.emitirNfce && cenario === "ok") {
            showCupom(saleId, clienteNome, totalPago);
            toast("Venda #" + saleId + " paga. NFC-e autorizada.");
          } else if (state.emitirNfce) {
            toast("Venda paga, mas a nota foi recusada. Veja em Notas.", true);
          } else {
            toast("Venda #" + saleId + " paga.");
          }
          state.cart = [];
          state.clienteVenda = null;
          state.cliBusca = "";
          state.cliDropOpen = false;
          state.descontoTipo = "none";
          state.descontoValor = 0;
          render();
        }, 700);
      };
    }

    function render() {
      const app = document.getElementById("app");
      const map = {
        login: screenLogin,
        home: screenHome,
        caixa: screenCaixa,
        pdv: screenPdv,
        consignados: screenConsignados,
        produtos: screenProdutos,
        marcas: screenMarcas,
        clientes: screenClientes,
        estoque: screenEstoque,
        notas: screenNotas,
        config: screenConfig,
      };
      app.innerHTML = (map[state.screen] || screenHome)();
      bindNav();

      if (state.screen === "login") {
        document.getElementById("entrar").onclick = () => {
          state.role = document.getElementById("as-cont").checked ? "contador" : "equipe";
          state.user = state.role === "contador" ? "Paulo · contador" : "Márcia";
          state.screen = "home";
          state.menuOpen = false;
          toast("Bem-vinda.");
        };
      }

      document.querySelectorAll("[data-tile]").forEach((b) => {
        b.onclick = () => {
          const t = b.dataset.tile;
          if (t === "pdv" && !state.caixaAberto) {
            state.screen = "caixa";
            toast("Abra o caixa antes de vender.", true);
            return;
          }
          state.screen = t;
          state.toast = "";
          render();
        };
      });

      if (state.screen === "caixa") {
        const abrir = document.getElementById("abrir-cx");
        if (abrir) abrir.onclick = () => {
          if (state.sub) return;
          state.sub = true; render();
          setTimeout(() => { state.sub = false; state.caixaAberto = true; toast("Caixa aberto."); state.screen = "pdv"; render(); }, 500);
        };
        const fechar = document.getElementById("fechar-cx");
        if (fechar) fechar.onclick = () => {
          if (state.sub) return;
          if (state.cart.length) { toast("Finalize ou limpe a venda aberta antes de fechar.", true); return; }
          state.sub = true; render();
          setTimeout(() => {
            state.sub = false;
            state.caixaAberto = false;
            toast("Caixa fechado.");
            printFechamentoCaixa();
            render();
          }, 500);
        };
        const ir = document.getElementById("ir-pdv");
        if (ir) ir.onclick = () => { state.screen = "pdv"; render(); };
        const pr = document.getElementById("print-cx");
        if (pr) pr.onclick = printFechamentoCaixa;
        const sang = document.getElementById("btn-ret");
        if (sang) sang.onclick = openSangriaModal;
      }

      if (state.screen === "pdv") {
        document.getElementById("btn-buscar").onclick = () => modalBusca(document.getElementById("busca-rapida").value);
        document.getElementById("btn-barra").onclick = modalBarra;
        document.getElementById("busca-rapida").onkeydown = (e) => {
          if (e.key === "Enter") modalBusca(e.target.value);
        };
        document.getElementById("btn-consignar").onclick = () => modalConsignar();
        document.getElementById("btn-pagar").onclick = modalPagamento;
        document.getElementById("btn-nova").onclick = () => {
          state.cart = [];
          state.clienteVenda = null;
          state.cliBusca = "";
          state.cliDropOpen = false;
          state.descontoTipo = "none";
          state.descontoValor = 0;
          toast("Venda limpa.");
          render();
        };
        bindClienteCombo();
        const descTipo = document.getElementById("desc-tipo");
        if (descTipo) {
          descTipo.onchange = () => {
            state.descontoTipo = descTipo.value;
            if (state.descontoTipo === "none") state.descontoValor = 0;
            render();
          };
        }
        const descValor = document.getElementById("desc-valor");
        if (descValor) {
          descValor.onchange = () => {
            const raw = descValor.value.replace(".", "").replace(",", ".");
            state.descontoValor = parseFloat(raw) || 0;
            render();
          };
          descValor.onkeydown = (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              const raw = descValor.value.replace(".", "").replace(",", ".");
              state.descontoValor = parseFloat(raw) || 0;
              render();
            }
          };
        }
        document.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { state.cart.splice(+b.dataset.rm, 1); render(); });
        document.querySelectorAll("[data-inc]").forEach((b) => b.onclick = () => { state.cart[+b.dataset.inc].qtd += 1; render(); });
        document.querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => {
          const i = +b.dataset.dec;
          if (state.cart[i].qtd <= 1) state.cart.splice(i, 1);
          else state.cart[i].qtd -= 1;
          render();
        });
      }

      if (state.screen === "consignados") {
        document.getElementById("novo-cons").onclick = () => {
          if (!state.clienteVenda) {
            state.screen = "pdv";
            toast("Escolha o cliente na venda e use Consignar, ou selecione o cliente agora.", true);
            modalCliente();
            return;
          }
          modalConsignar();
        };
        document.querySelectorAll("[data-dev]").forEach((b) => {
          b.onclick = () => {
            if (state.sub) return;
            const c = consignados.find((x) => x.id === b.dataset.dev);
            if (!c || c.status !== "aberto") return;
            state.sub = true;
            setTimeout(() => {
              state.sub = false;
              const p = produtos.find((x) => x.id === c.produtoId);
              if (p) p.estoque += c.qtd;
              c.status = "devolvido";
              toast("Produto devolvido. Estoque atualizado.");
              render();
            }, 400);
          };
        });
        document.querySelectorAll("[data-venda]").forEach((b) => {
          b.onclick = () => {
            const c = consignados.find((x) => x.id === b.dataset.venda);
            if (!c || c.status !== "aberto") return;
            const p = produtos.find((x) => x.id === c.produtoId);
            state.clienteVenda = clientes.find((x) => x.id === c.clienteId) || state.clienteVenda;
            state.cart = [{ id: p.id, nome: p.nome, barra: p.barra, preco: p.preco, qtd: c.qtd }];
            c.status = "vendido";
            if (p) p.estoque += c.qtd;
            state.caixaAberto = true;
            state.screen = "pdv";
            toast("Consignado convertido: finalize o pagamento.");
            render();
          };
        });
        document.querySelectorAll("[data-nota]").forEach((b) => {
          b.onclick = () => showNotinhaConsignado(consignados.find((x) => x.id === b.dataset.nota));
        });
      }

      if (state.screen === "produtos") {
        document.getElementById("novo-prod").onclick = () => modalProduto(null);
        document.getElementById("filtrar-prod").onclick = () => {
          state.filtroProd = document.getElementById("busca-prod").value;
          render();
        };
        document.querySelectorAll("[data-ed-prod]").forEach((b) => {
          b.onclick = () => modalProduto(produtos.find((p) => p.id === b.dataset.edProd));
        });
      }

      if (state.screen === "marcas") {
        document.getElementById("add-marca").onclick = () => {
          const n = document.getElementById("nova-marca").value.trim();
          if (!n) return;
          marcas.push({ id: "m" + Date.now(), nome: n });
          toast("Marca adicionada.");
          render();
        };
        document.getElementById("add-cat").onclick = () => {
          const n = document.getElementById("nova-cat").value.trim();
          if (!n) return;
          categorias.push({ id: "c" + Date.now(), nome: n });
          toast("Categoria adicionada.");
          render();
        };
      }

      if (state.screen === "clientes") {
        document.getElementById("novo-cli").onclick = () => modalClienteEdit(null);
        document.getElementById("import-cli").onclick = () => {
          openModal(`<h3>Importar Excel</h3>
            <p class="hint">Formato da planilha de titulares e dependentes ainda a definir com a Baldan.</p>
            <div class="field"><label>Arquivo (.xlsx)</label><input type="file" accept=".xlsx,.xls,.csv" /></div>
            <button type="button" class="btn btn-ghost" id="cancel-m">Fechar</button>`);
          document.getElementById("cancel-m").onclick = closeModal;
        };
        document.getElementById("filtrar-cli").onclick = () => {
          state.filtroCli = document.getElementById("busca-cli").value;
          render();
        };
        document.querySelectorAll("[data-ed-cli]").forEach((b) => {
          b.onclick = () => modalClienteEdit(clientes.find((c) => c.id === b.dataset.edCli));
        });
      }

      if (state.screen === "estoque") {
        document.querySelectorAll("[data-aj]").forEach((b) => {
          b.onclick = () => {
            const p = produtos.find((x) => x.id === b.dataset.aj);
            openModal(`<h3>Ajustar estoque</h3><p>${p.nome}</p>
              <div class="field"><label>Novo saldo</label><input id="novo-est" value="${p.estoque}" /></div>
              <div class="row"><button type="button" class="btn btn-primary" id="ok-est">Salvar</button>
              <button type="button" class="btn btn-ghost" id="cancel-m">Cancelar</button></div>`);
            document.getElementById("cancel-m").onclick = closeModal;
            document.getElementById("ok-est").onclick = () => {
              p.estoque = parseFloat(document.getElementById("novo-est").value.replace(",", ".")) || 0;
              closeModal();
              toast("Estoque atualizado.");
              render();
            };
          };
        });
      }

      if (state.screen === "notas") {
        document.querySelectorAll("[data-print]").forEach((b) => {
          b.onclick = () => {
            const n = notes.find((x) => x.id === b.dataset.print);
            showCupom(n.sale, n.who, n.value);
          };
        });
        document.querySelectorAll("[data-retry]").forEach((b) => {
          b.onclick = () => {
            if (state.sub) return;
            state.sub = true;
            setTimeout(() => {
              state.sub = false;
              notes.find((x) => x.id === b.dataset.retry).status = "ok";
              toast("Nota autorizada.");
              render();
            }, 700);
          };
        });
      }

      if (state.screen === "config") {
        const s = document.getElementById("salvar-cfg");
        if (s) s.onclick = () => {
          if (state.sub) return;
          state.sub = true; render();
          setTimeout(() => { state.sub = false; toast("Configuração salva."); render(); }, 600);
        };
      }
    }

    render();
  </script>
</body>
</html>
