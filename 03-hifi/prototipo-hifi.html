<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hi-fi — &lt;slug&gt;</title>
  <style>
    :root{--ink:#0f172a;--accent:#0f766e;--bg:#f8fafc}
    body{margin:0;font-family:Georgia,"Segoe UI",sans-serif;background:linear-gradient(180deg,#e2e8f0,#f8fafc);color:var(--ink)}
    .page{max-width:1100px;margin:0 auto;padding:28px 20px}
    h1{letter-spacing:-.02em}
    .shell{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(15,23,42,.08)}
    .top{background:var(--accent);color:#fff;padding:14px 18px;font-weight:700}
    .body{padding:20px;display:grid;gap:12px}
    .card{border:1px solid #e2e8f0;border-radius:8px;padding:14px}
    .btn{display:inline-block;background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none}
  </style>
</head>
<body>
  <div class="page">
    <h1>Protótipo hi-fi — &lt;slug&gt;</h1>
    <p>Aplicar identidade do cliente. Espelhar telas do lo-fi aprovado.</p>
    <div class="shell">
      <div class="top">App — marca</div>
      <div class="body">
        <div class="card">Dashboard / home</div>
        <a class="btn" href="#">CTA principal</a>
      </div>
    </div>
  </div>
</body>
</html>
