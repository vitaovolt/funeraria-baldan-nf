# Site isolado — NÃO incluir em outros vhosts.
# Destino na EC2: /etc/nginx/sites-available/funerariabaldan.educraft.com.br
# Root só de /var/www/funerariabaldan/03-hifi. Não misturar com outros projetos.

server {
    server_name funerariabaldan.educraft.com.br;

    root /var/www/funerariabaldan/03-hifi;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/funerariabaldan.educraft.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/funerariabaldan.educraft.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = funerariabaldan.educraft.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name funerariabaldan.educraft.com.br;
    return 404; # managed by Certbot
}
