# Site isolado — NÃO incluir em outros vhosts.
# Destino na EC2: /etc/nginx/sites-available/funerariabaldan
# Root só desta pasta de preview (03-hifi).

server {
    listen 80;
    listen [::]:80;
    server_name funerariabaldan.educraft.com.br;

    root /var/www/funerariabaldan/03-hifi;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
